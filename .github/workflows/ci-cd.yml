name: "InvenFlow CI/CD Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── JOB 1 ─────────────────────────────────────────────────────────────────
  backend-validate:
    name: "Backend — Validate & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: "Install Python dependencies"
        run: pip install --no-cache-dir -r requirements.txt

      - name: "Run startup validation (SQLite)"
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          DEBUG: "false"
          ALLOWED_ORIGINS: "http://localhost:5173"
          APP_NAME: "InvenFlow API"
          APP_VERSION: "1.0.0"
        run: python validate.py

      - name: "Verify all API routes are registered"
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          DEBUG: "false"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from app.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          required = ['/products/', '/customers/', '/orders/', '/dashboard/stats', '/health']
          missing = [r for r in required if r not in routes]
          if missing:
              print('MISSING ROUTES:', missing)
              sys.exit(1)
          print('All', len(routes), 'routes registered correctly:', required)
          "

      - name: "Cleanup test database"
        if: always()
        run: rm -f ci_test.db ci_test.db-shm ci_test.db-wal

  # ── JOB 2 ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: "Frontend — Build Production Bundle"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Install npm dependencies"
        run: npm ci --prefer-offline

      - name: "Build production bundle"
        env:
          # Uses secret if set, otherwise placeholder (Vercel rebuilds with real URL anyway)
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://invenflow-backend.onrender.com' }}
        run: npm run build

      - name: "Verify dist output"
        run: |
          echo "Build output:"
          ls -lh dist/
          ls -lh dist/assets/
          # Ensure index.html exists
          test -f dist/index.html && echo "index.html: OK"
          # Ensure at least one JS bundle exists
          ls dist/assets/*.js > /dev/null 2>&1 && echo "JS bundles: OK"
          echo "Build verification complete"

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "frontend-dist-${{ github.sha }}"
          path: frontend/dist/
          retention-days: 7

  # ── JOB 3 ─────────────────────────────────────────────────────────────────
  docker-build-push:
    name: "Docker — Build & Push Backend Image"
    runs-on: ubuntu-latest
    needs: [backend-validate]
    # Only push on pushes to main/master — not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract image metadata (tags & labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/invenflow-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: "Build and push multi-arch Docker image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Use GitHub Actions cache to speed up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Verify image on Docker Hub"
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/invenflow-backend:latest"
          echo "Pulling image to verify it was pushed..."
          docker pull "$IMAGE"
          echo ""
          echo "Image info:"
          docker inspect "$IMAGE" --format='Size: {{.Size}} bytes'
          echo ""
          echo "Docker Hub URL:"
          echo "  https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/invenflow-backend"

      - name: "Test image starts correctly"
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/invenflow-backend:latest"
          echo "Starting container with SQLite for smoke test..."
          docker run -d \
            --name invenflow-smoke \
            -e DATABASE_URL="sqlite:///./smoke_test.db" \
            -e ALLOWED_ORIGINS="http://localhost" \
            -e PORT=8000 \
            -p 8000:8000 \
            "$IMAGE"
          echo "Waiting 10s for startup..."
          sleep 10
          echo "Testing health endpoint..."
          curl -f http://localhost:8000/health && echo "" && echo "Health check: PASSED"
          echo "Testing Swagger docs..."
          curl -f -s http://localhost:8000/docs | grep -q "swagger" && echo "Swagger: PASSED"
          docker stop invenflow-smoke && docker rm invenflow-smoke
          echo "Container smoke test: PASSED"

  # ── JOB 4 ─────────────────────────────────────────────────────────────────
  deployment-summary:
    name: "Deployment Summary"
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-build, docker-build-push]
    if: always() && github.event_name == 'push'

    steps:
      - name: "Print deployment summary"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║     InvenFlow CI/CD — Pipeline Results       ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Backend Tests  : ${{ needs.backend-validate.result }}"
          echo "║  Frontend Build : ${{ needs.frontend-build.result }}"
          echo "║  Docker Push    : ${{ needs.docker-build-push.result }}"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Docker Hub:                                 ║"
          echo "║  hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/invenflow-backend"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Next: Deploy Render + Vercel (see DEPLOY.md)║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
