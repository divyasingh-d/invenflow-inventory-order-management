  docker-build-push:
    name: "Docker — Build & Push Backend Image"
    runs-on: ubuntu-latest
    needs: [backend-validate]

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Extract image metadata (tags & labels)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: divyasingh969692/invenflow-inventory-order-management
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            divyasingh969692/invenflow-inventory-order-management:latest

      - name: "Verify image on Docker Hub"
        run: |
          docker pull divyasingh969692/invenflow-inventory-order-management:latest

      - name: "Test image starts correctly"
        run: |
          docker run -d \
            --name invenflow-smoke \
            -e DATABASE_URL="sqlite:///./smoke_test.db" \
            -e ALLOWED_ORIGINS="http://localhost" \
            -e PORT=8000 \
            -p 8000:8000 \
            divyasingh969692/invenflow-inventory-order-management:latest

          sleep 10
          curl -f http://localhost:8000/health

          docker stop invenflow-smoke
          docker rm invenflow-smoke
