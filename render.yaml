# Render deployment configuration
services:
  - type: web
    name: invenflow-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_NAME
        value: "InvenFlow API"
      - key: APP_VERSION
        value: "1.0.0"
    healthCheckPath: /health
